[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pynq-pr"
version = "0.1.1"
requires-python = ">=3.10"
description = "YAML-driven Vivado DFX (partial reconfiguration) flow, swap-aware co-simulation and PYNQ runtime for Cocotb-PYNQ-PR designs"
readme = "README.md"
authors = [
    { name="Emir Guevara", email="e2guevar@uwaterloo.ca" },
    { name="Chaitanya Sharma", email="chaitanya.sharma@uwaterloo.ca" },
    { name="Gavin Lusby", email="gdplusby@uwaterloo.ca" },
    { name="Nachiket Kapre", email="nachiket@uwaterloo.ca" }
]
# license: pending decision (see LICENSE status in README); do not publish to PyPI before it is set
# cocotbpynq 0.1.0 is distributed from GitHub until it is on PyPI
dependencies = ["pyyaml", "cocotbpynq @ git+https://github.com/watcag/cocotbpynq@v0.1.0"]

[project.optional-dependencies]
examples = ["pillow"]

[project.urls]
Homepage = "https://github.com/watcag/pynq-pr"
Issues = "https://github.com/watcag/pynq-pr/issues"

[tool.setuptools]
packages = ["pynq_pr"]

[tool.setuptools.package-data]
pynq_pr = [
    "scripts/*.tcl",
    "versatile/rtl/*.vhd",
    "versatile/rtl/*.v",
    "versatile/ip/**/*",
    "versatile/NOTICE",
    "rtl/*.v",
    "constraints/*.xdc",
]

[project.scripts]
pynq-pr = "pynq_pr.cli:main"
